
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DarkGPT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090910;
      color: #f3f2ff;
      font: 16px system-ui, sans-serif;
    }
    header {
      padding: 20px;
      background: #14101f;
      border-bottom: 1px solid #38284f;
    }
    header span { color: #a78bfa; }
    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    section {
      background: #12121c;
      border: 1px solid #30283f;
      border-radius: 15px;
      padding: 16px;
      min-width: 0;
    }
    #chat {
      height: 350px;
      overflow-y: auto;
      margin: 15px 0;
    }
    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      background: #201a30;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    input, textarea, button {
      font: inherit;
      border-radius: 9px;
      padding: 11px;
    }
    input, textarea {
      width: 100%;
      color: white;
      background: #090910;
      border: 1px solid #423453;
      margin: 5px 0 12px;
    }
    button {
      color: white;
      background: #713bd1;
      border: 0;
      cursor: pointer;
      margin: 3px;
    }
    button:hover { background: #8b5cf6; }
    img { max-width: 100%; }
    #preview { margin: 12px 0; }
    small { color: #b8a9d8; }
    @media(max-width:700px) {
      main { grid-template-columns: 1fr; padding: 10px; }
    }
  </style>
</head>
<body>
<header>
  <h2>◈ Dark<span>GPT</span></h2>
  <small>No API key required</small>
</header>

<main>
  <section>
    <h3>AI Chat</h3>
    <button id="load">Load free browser AI</button>
    <small id="status">Demo mode</small>
    <div id="chat">
      <div class="message">
        Welcome to DarkGPT! Load the optional browser AI
        model for more flexible answers.
      </div>
    </div>
    <textarea id="question" rows="3"
      placeholder="Ask me something..."></textarea>
    <button id="send">Send</button>
  </section>

  <section>
    <h3>Image Editor</h3>
    <input id="file" type="file" accept="image/*">
    <div id="preview">Your image will appear here.</div>

    <label>Brightness</label>
    <input id="brightness" type="range"
      min="30" max="180" value="100">

    <label>Contrast</label>
    <input id="contrast" type="range"
      min="30" max="180" value="100">

    <label>Saturation</label>
    <input id="saturation" type="range"
      min="0" max="200" value="100">

    <button id="gray">Grayscale</button>
    <button id="sepia">Sepia</button>
    <button id="rotate">Rotate</button>
    <button id="save">Save image</button>
    <p><small>
      Edits happen locally in your browser. This is a basic
      editor, not a generative image AI.
    </small></p>
  </section>
</main>

<script type="module">
const $ = id => document.getElementById(id);
let ai = null;
let image = null;
let rotation = 0;
let effect = '';

function message(text, who = 'DarkGPT') {
  const div = document.createElement('div');
  div.className = 'message';
  const label = document.createElement('small');
  label.textContent = who;
  const content = document.createElement('div');
  content.textContent = text;
  div.append(label, content);
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
  return content;
}

$('load').onclick = async () => {
  $('status').textContent = 'Loading model...';
  $('load').disabled = true;

  try {
    const { pipeline, env } = await import(
      'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'
    );
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    ai = await pipeline(
      'text-generation',
      'Xenova/Qwen1.5-0.5B-Chat'
    );

    $('status').textContent = 'AI model ready';
    message('The browser AI model has loaded.');
  } catch (error) {
    $('status').textContent = 'Model unavailable';
    message('Could not load the model. Check your internet connection and browser.');
  } finally {
    $('load').disabled = false;
  }
};

$('send').onclick = async () => {
  const text = $('question').value.trim();
  if (!text) return;

  $('question').value = '';
  message(text, 'You');

  if (!ai) {
    message('Demo mode: load the browser AI model for more flexible replies.');
    return;
  }

  const answer = message('Thinking...');
  try {
    const result = await ai([
      {
        role: 'system',
        content: 'You are DarkGPT, a helpful assistant. Be clear and honest. Discuss sensitive subjects appropriately, but do not facilitate serious harm.'
      },
      { role: 'user', content: text }
    ], { max_new_tokens: 200 });

    const generated = result[0].generated_text;
    answer.textContent = Array.isArray(generated)
      ? (generated.filter(x => x.role === 'assistant').at(-1)?.content || 'No response.')
      : String(generated);
  } catch {
    answer.textContent = 'Sorry, the model could not generate a reply.';
  }
};

// Local photo editor
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

function render() {
  if (!image) return;

  const w = image.naturalWidth;
  const h = image.naturalHeight;
  const sideways = Math.abs(rotation % 180) === 90;

  canvas.width = sideways ? h : w;
  canvas.height = sideways ? w : h;

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotation * Math.PI / 180);

  ctx.filter =
    `brightness(${$('brightness').value}%) ` +
    `contrast(${$('contrast').value}%) ` +
    `saturate(${$('saturation').value}%)` +
    (effect === 'gray' ? ' grayscale(1)' :
     effect === 'sepia' ? ' sepia(1)' : '');

  ctx.drawImage(image, -w / 2, -h / 2, w, h);
  ctx.restore();
  ctx.filter = 'none';

  const preview = document.createElement('img');
  preview.src = canvas.toDataURL('image/png');
  preview.alt = 'Edited photo';
  $('preview').replaceChildren(preview);
}

$('file').onchange = event => {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    image = img;
    rotation = 0;
    effect = '';
    render();
    URL.revokeObjectURL(url);
  };

  img.src = url;
};

['brightness', 'contrast', 'saturation'].forEach(id => {
  $(id).oninput = render;
});

$('gray').onclick = () => { effect = 'gray'; render(); };
$('sepia').onclick = () => { effect = 'sepia'; render(); };
$('rotate').onclick = () => {
  rotation = (rotation + 90) % 360;
  render();
};

$('save').onclick = () => {
  if (!image) {
    message('Choose an image first.');
    return;
  }

  const link = document.createElement('a');
  link.download = 'darkgpt-edited.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
};
</script>
</body>
</html>
